<style>



:root {
  font-family: "Space Grotesk", "Segoe UI", Tahoma, Arial, sans-serif;
  color: #eaf5ff;
  background: #050912;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --bg: #050912;
  --bg-2: #08111e;
  --panel: rgba(10, 23, 39, .78);
  --panel-solid: #0c1a2b;
  --line: rgba(151, 207, 255, .15);
  --line-bright: rgba(151, 207, 255, .28);
  --text: #edf7ff;
  --muted: #8ba0b7;
  --muted-2: #52677f;
  --cyan: #63e6ff;
  --blue: #4d7cff;
  --mint: #7ff3c7;
  --amber: #f5b94c;
  --coral: #ff6b6b;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
button, a { font: inherit; }
button { color: inherit; }
button:not(:disabled) { cursor: pointer; }
::selection { color: #001a28; background: var(--cyan); }

.app-shell { position: relative; overflow: hidden; background: radial-gradient(circle at 70% 12%, rgba(28, 74, 133, .18), transparent 34%), var(--bg); }
.container { width: min(1180px, calc(100% - 48px)); margin: 0 auto; position: relative; z-index: 2; }
.section-pad { padding: 124px 0; }
.ambient-grid { position: absolute; inset: 0; pointer-events: none; opacity: .35; background-image: linear-gradient(rgba(99, 230, 255, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 230, 255, .025) 1px, transparent 1px); background-size: 72px 72px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
.star-field { position: absolute; inset: 0; pointer-events: none; opacity: .7; }
.star-field i { position: absolute; display: block; width: 2px; height: 2px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px 2px rgba(99,230,255,.4); animation: twinkle 4s ease-in-out infinite; }
.star-field i:nth-child(1) { left: 8%; top: 15%; animation-delay: -.7s; } .star-field i:nth-child(2) { left: 22%; top: 31%; opacity: .45; animation-delay: -2s; } .star-field i:nth-child(3) { left: 37%; top: 9%; opacity: .5; } .star-field i:nth-child(4) { left: 63%; top: 18%; } .star-field i:nth-child(5) { left: 89%; top: 27%; opacity: .45; animation-delay: -1s; } .star-field i:nth-child(6) { left: 72%; top: 44%; opacity: .3; } .star-field i:nth-child(7) { left: 14%; top: 69%; opacity: .35; } .star-field i:nth-child(8) { left: 52%; top: 73%; opacity: .45; } .star-field i:nth-child(9) { left: 94%; top: 77%; opacity: .5; } .star-field i:nth-child(10) { left: 44%; top: 47%; opacity: .25; }

.site-header { position: absolute; z-index: 10; top: 0; left: 0; right: 0; border-bottom: 1px solid rgba(151,207,255,.09); background: linear-gradient(to bottom, rgba(5,9,18,.82), rgba(5,9,18,.18)); backdrop-filter: blur(16px); }
.header-inner { height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.logo-button { appearance: none; border: 0; background: none; padding: 0; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); }
.brand-mark { display: grid; place-items: center; position: relative; width: 35px; height: 35px; border: 1px solid rgba(99,230,255,.65); color: var(--cyan); background: rgba(8,25,42,.76); clip-path: polygon(50% 0, 92% 16%, 86% 70%, 50% 100%, 14% 70%, 8% 16%); }
.brand-mark svg { position: relative; z-index: 2; }
.brand-orbit { position: absolute; width: 32px; height: 12px; border: 1px solid var(--cyan); border-radius: 50%; transform: rotate(-32deg); opacity: .8; }
.brand-word { font-size: 16px; font-weight: 700; letter-spacing: -.04em; }
.brand-word span { color: var(--cyan); }
.main-nav { display: flex; align-items: center; gap: 30px; margin-inline: auto; }
.main-nav button, .back-top { color: var(--muted); background: none; border: 0; padding: 8px 0; font-size: 12px; letter-spacing: .04em; transition: color .2s ease; }
.main-nav button:hover, .back-top:hover { color: var(--cyan); }
.header-actions { display: flex; align-items: center; gap: 18px; }
.language-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--cyan); background: transparent; border: 1px solid rgba(99,230,255,.35); border-radius: 5px; padding: 8px 12px; font-family: var(--mono); font-size: 10px; }
.language-toggle:hover { background: rgba(99,230,255,.1); border-color: var(--cyan); }
.menu-toggle { display: none; border: 0; background: none; color: var(--text); }

.hero-section { position: relative; min-height: 760px; padding-top: 175px; padding-bottom: 30px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-art { position: absolute; inset: 0; background-position: center right; background-size: cover; opacity: .32; filter: saturate(.75) contrast(1.06); }
.hero-vignette { position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, rgba(5,9,18,.93) 30%, rgba(5,9,18,.43) 66%, rgba(5,9,18,.83) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 26%, rgba(5,9,18,.2) 100%); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.03fr) minmax(420px, .97fr); align-items: center; flex: 1; gap: 32px; }
.hero-copy { position: relative; z-index: 3; max-width: 680px; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--cyan); font: 500 10px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.eyebrow-line { width: 29px; height: 1px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
h1, h2, h3, p { margin: 0; }
h1 { margin-top: 24px; font-size: clamp(53px, 7.2vw, 94px); line-height: .96; letter-spacing: -.075em; font-weight: 600; max-width: 700px; }
h1 em { color: var(--cyan); font-style: normal; text-shadow: 0 0 36px rgba(99,230,255,.25); }
.hero-body { max-width: 530px; color: #aabbd0; font-size: 16px; line-height: 1.75; margin-top: 30px; }
.hero-cta-row { display: flex; align-items: center; gap: 12px; margin-top: 34px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid transparent; border-radius: 5px; padding: 12px 17px; font-size: 12px; font-weight: 600; letter-spacing: .01em; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { color: #03121c; background: var(--cyan); box-shadow: 0 0 26px rgba(99,230,255,.22); }
.btn-primary:hover { background: #a7f4ff; }
.btn-ghost, .btn-outline { color: var(--text); background: rgba(13,29,48,.38); border-color: rgba(151,207,255,.25); }
.btn-ghost:hover, .btn-outline:hover { border-color: var(--cyan); background: rgba(99,230,255,.08); }
.hero-trust-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 32px; }
.status-pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid currentColor; border-radius: 999px; padding: 6px 9px; font: 500 9px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.status-pill.mint { color: var(--mint); background: rgba(127,243,199,.06); } .status-pill.blue { color: var(--cyan); background: rgba(99,230,255,.06); } .status-pill.amber { color: var(--amber); background: rgba(245,185,76,.07); } .status-pill.coral { color: var(--coral); background: rgba(255,107,107,.07); }
.status-dot, .live-indicator span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; animation: pulse 2s infinite; }
.micro-note { display: inline-flex; align-items: center; gap: 6px; color: #8297ad; font: 10px var(--mono); }
.orbital-stage { position: relative; width: min(100%, 590px); aspect-ratio: 1; justify-self: end; display: grid; place-items: center; }
.orbit { position: absolute; border: 1px solid rgba(99,230,255,.25); border-radius: 50%; transform: rotate(-28deg); }
.orbit-one { width: 88%; height: 38%; animation: orbit-spin 22s linear infinite; } .orbit-two { width: 72%; height: 60%; transform: rotate(58deg); border-color: rgba(127,243,199,.16); animation: orbit-spin 30s linear reverse infinite; } .orbit-three { width: 48%; height: 88%; transform: rotate(78deg); border-color: rgba(77,124,255,.2); }
.earth { position: relative; width: 45%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #1e9cc1 0%, #0d486b 35%, #071b32 71%, #020611 100%); box-shadow: inset -23px -18px 35px rgba(0,0,0,.75), 0 0 0 1px rgba(99,230,255,.3), 0 0 50px rgba(48,178,226,.2); overflow: hidden; }
.earth::before, .earth::after { content: ""; position: absolute; border-radius: 46% 54% 50% 50%; background: rgba(127,243,199,.34); filter: blur(2px); transform: rotate(-18deg); }
.earth::before { width: 34%; height: 58%; top: 16%; left: 21%; } .earth::after { width: 54%; height: 25%; top: 44%; left: 40%; background: rgba(79,200,236,.26); }
.earth-glow { position: absolute; inset: -16%; border-radius: 50%; border: 1px solid rgba(127,243,199,.55); box-shadow: 0 0 20px rgba(127,243,199,.2); animation: earth-scan 5s linear infinite; }
.earth-surface span { position: absolute; display: block; border: 1px solid rgba(99,230,255,.3); border-radius: 50%; } .earth-surface span:nth-child(1) { inset: 10% 28%; } .earth-surface span:nth-child(2) { inset: 28% 10%; } .earth-surface span:nth-child(3) { inset: 45% 19%; }
.satellite { position: absolute; top: 21%; right: 11%; width: 37%; height: 21%; display: flex; align-items: center; justify-content: center; gap: 4px; transform: rotate(-19deg); animation: float-sat 6s ease-in-out infinite; }
.sat-body { display: grid; place-items: center; width: 56px; height: 46px; color: var(--cyan); border: 1px solid var(--cyan); background: rgba(5,18,32,.92); box-shadow: 0 0 18px rgba(99,230,255,.2); z-index: 2; }
.solar-panel { width: 86px; height: 34px; border: 1px solid rgba(99,230,255,.75); background: repeating-linear-gradient(90deg, transparent 0 16px, rgba(99,230,255,.45) 17px 18px), repeating-linear-gradient(0deg, rgba(77,124,255,.35) 0 4px, transparent 5px 8px), #0b2846; }
.signal-ring { position: absolute; width: 110px; height: 110px; border: 1px solid rgba(99,230,255,.42); border-radius: 50%; animation: signal-ring 2.7s ease-out infinite; }
.orbit-label { position: absolute; z-index: 3; color: #9fb5cb; font: 9px var(--mono); letter-spacing: .05em; background: rgba(5,9,18,.65); border: 1px solid rgba(151,207,255,.18); padding: 6px 8px; backdrop-filter: blur(5px); }
.label-a { top: 20%; left: 1%; } .label-b { bottom: 18%; right: 4%; display: flex; align-items: center; gap: 6px; color: var(--mint); }
.label-dot { display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 9px var(--mint); }
.scan-line { position: absolute; width: 130%; height: 1px; background: linear-gradient(90deg, transparent, rgba(99,230,255,.7), transparent); transform: rotate(-18deg); opacity: .32; animation: scan 5s ease-in-out infinite; }
.hero-bottom-line { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid rgba(151,207,255,.12); color: #58718c; font: 9px var(--mono); letter-spacing: .08em; }
.scroll-hint { display: inline-flex; align-items: center; gap: 7px; color: #738aa2; letter-spacing: .02em; } .scroll-wheel { width: 13px; height: 18px; border: 1px solid #738aa2; border-radius: 99px; position: relative; } .scroll-wheel::before { content: ""; position: absolute; left: 5px; top: 3px; width: 2px; height: 4px; border-radius: 2px; background: var(--cyan); animation: scroll-wheel 2s infinite; }
.live-indicator { display: inline-flex; align-items: center; gap: 7px; color: var(--mint); font: 9px var(--mono); text-transform: uppercase; letter-spacing: .06em; }

.dashboard-section { position: relative; background: linear-gradient(180deg, rgba(10,21,35,.55), rgba(5,9,18,0)); border-top: 1px solid rgba(151,207,255,.08); }
.section-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 40px; } .section-heading-row h2, .simulator-copy h2, .why-heading h2, .brief-header h2 { font-size: clamp(32px, 4vw, 51px); line-height: 1; letter-spacing: -.06em; margin-top: 17px; } .section-heading-row p { margin-top: 14px; color: var(--muted); font-size: 14px; }
.sync-readout { display: flex; align-items: center; gap: 8px; color: #6e849b; font: 10px var(--mono); white-space: nowrap; } .sync-readout svg { color: var(--cyan); } .sync-readout strong { color: var(--text); font-weight: 500; }
.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.panel { border: 1px solid var(--line); background: linear-gradient(145deg, rgba(15,31,51,.88), rgba(8,18,31,.76)); box-shadow: 0 12px 40px rgba(0,0,0,.14); }
.metric-card { min-height: 157px; padding: 18px; position: relative; overflow: hidden; }
.metric-top, .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #7890aa; font: 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; } .metric-top svg { color: var(--cyan); opacity: .85; }
.metric-card > strong { display: block; margin-top: 14px; font-size: 30px; letter-spacing: -.05em; } .metric-card > strong small { color: var(--muted); font: 11px var(--mono); letter-spacing: 0; }
.metric-detail { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: #7188a1; font: 9px var(--mono); } .metric-detail .status-pill { padding: 4px 7px; font-size: 8px; } .metric-up { display: inline-flex; align-items: center; gap: 2px; color: var(--mint); } .metric-down { display: inline-flex; align-items: center; gap: 2px; color: var(--coral); }
.mini-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(99,230,255,.08); } .mini-progress span { display: block; height: 100%; background: var(--mint); box-shadow: 0 0 13px var(--mint); transition: width .4s ease; }
.sparkline { position: absolute; bottom: 12px; right: 14px; width: 34%; height: 40px; opacity: .7; } .sparkline.cyan { color: var(--cyan); } .sparkline.mint { color: var(--mint); } .sparkline.amber { color: var(--amber); } .metric-alert { border-color: rgba(245,185,76,.38); } .metric-alert .metric-top svg, .metric-threat .metric-top svg { color: var(--amber); } .metric-threat > strong { color: var(--mint); font-size: 26px; }
.threat-scale { display: flex; gap: 4px; margin-top: 13px; } .threat-scale span { display: block; width: 34px; height: 4px; background: rgba(127,243,199,.16); } .threat-scale span.filled { background: var(--mint); box-shadow: 0 0 8px rgba(127,243,199,.4); } .threat-scale span.filled.critical { background: var(--coral); box-shadow: 0 0 8px rgba(255,107,107,.4); }
.dashboard-layout { display: grid; grid-template-columns: 1.42fr .78fr; gap: 12px; margin-top: 12px; }
.chart-panel, .link-panel, .activity-panel { padding: 20px; } .panel-kicker { display: flex; align-items: center; gap: 7px; color: var(--cyan); font: 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; } .panel-kicker svg { opacity: .9; } .panel-header h3 { color: var(--text); font-size: 15px; font-weight: 500; margin-top: 6px; letter-spacing: -.02em; }
.chart-legend { display: flex; gap: 14px; color: #8296ac; font: 9px var(--mono); } .chart-legend span { display: flex; align-items: center; gap: 5px; } .legend-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; } .legend-dot.cyan { background: var(--cyan); } .legend-dot.mint { background: var(--mint); }
.chart-area { position: relative; height: 195px; margin-top: 24px; padding-left: 34px; padding-bottom: 25px; } .chart-area::before { content: ""; position: absolute; inset: 0 0 25px 34px; background: repeating-linear-gradient(0deg, transparent 0 calc(25% - 1px), rgba(151,207,255,.1) 25%); } .chart-y-labels { position: absolute; left: 0; top: -6px; bottom: 29px; display: flex; flex-direction: column; justify-content: space-between; color: #546b83; font: 9px var(--mono); } .bars { height: 100%; position: relative; display: flex; align-items: end; justify-content: space-around; gap: 8px; padding: 0 11px; } .bar-group { flex: 1; height: 100%; display: flex; align-items: end; justify-content: center; gap: 3px; } .bar { width: 8px; min-height: 3px; border-radius: 2px 2px 0 0; transition: height .5s ease; } .bar-uplink { background: linear-gradient(to top, #217dc8, var(--cyan)); box-shadow: 0 0 10px rgba(99,230,255,.25); } .bar-downlink { background: linear-gradient(to top, #3a9c86, var(--mint)); opacity: .78; } .chart-x-labels { position: absolute; left: 34px; right: 0; bottom: 0; display: flex; justify-content: space-between; color: #546b83; font: 9px var(--mono); }

.link-panel { min-height: 287px; } .link-visual { display: flex; align-items: center; gap: 16px; padding: 28px 0 20px; } .link-pulse { display: grid; place-items: center; width: 72px; height: 72px; color: var(--cyan); border: 1px solid rgba(99,230,255,.35); border-radius: 50%; background: radial-gradient(circle, rgba(99,230,255,.18), rgba(99,230,255,.02) 63%, transparent 64%); box-shadow: 0 0 0 8px rgba(99,230,255,.035), 0 0 34px rgba(99,230,255,.12); } .link-visual strong { display: block; font-size: 28px; letter-spacing: -.05em; } .link-visual strong small { color: var(--muted); font: 10px var(--mono); letter-spacing: 0; } .link-visual span { display: block; margin-top: 6px; color: #7489a0; font: 9px var(--mono); } .signal-meter { display: flex; align-items: end; gap: 4px; height: 26px; margin: 0 0 21px; } .signal-meter i { width: 14px; height: 5px; display: block; background: rgba(127,243,199,.14); } .signal-meter i:nth-child(2) { height: 9px; } .signal-meter i:nth-child(3) { height: 13px; } .signal-meter i:nth-child(4) { height: 17px; } .signal-meter i:nth-child(5) { height: 21px; } .signal-meter i:nth-child(6) { height: 25px; } .signal-meter i:nth-child(7) { height: 21px; } .signal-meter i:nth-child(8) { height: 18px; } .signal-meter i.on { background: var(--mint); box-shadow: 0 0 8px rgba(127,243,199,.3); }
.link-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(151,207,255,.11); padding-top: 15px; gap: 10px; } .link-stats span { display: block; color: #627a92; font: 8px var(--mono); } .link-stats strong { display: block; margin-top: 5px; color: var(--text); font: 10px var(--mono); font-weight: 500; }
.activity-panel { margin-top: 12px; } .activity-count { color: var(--muted); font: 9px var(--mono); } .activity-list { margin-top: 18px; } .activity-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 13px; min-height: 54px; border-top: 1px solid rgba(151,207,255,.08); } .activity-icon { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: var(--cyan); background: rgba(99,230,255,.08); } .activity-row.warning .activity-icon { color: var(--amber); background: rgba(245,185,76,.08); } .activity-row.critical .activity-icon { color: var(--coral); background: rgba(255,107,107,.1); } .activity-content > div { display: flex; gap: 10px; align-items: center; } .activity-content strong { color: #d9ebfa; font-size: 11px; font-weight: 500; } .activity-content span { color: #5e7790; font: 8px var(--mono); } .activity-content p { color: #7389a1; font: 9px var(--mono); margin-top: 4px; } .activity-row time { color: #668098; font: 9px var(--mono); }

.simulator-section { border-top: 1px solid rgba(151,207,255,.08); background: radial-gradient(circle at 85% 35%, rgba(77,124,255,.09), transparent 31%); } .simulator-grid { display: grid; grid-template-columns: .84fr 1.16fr; gap: 100px; align-items: start; } .simulator-copy { max-width: 390px; } .simulator-copy h2 { max-width: 380px; } .simulator-copy > p { color: var(--muted); font-size: 14px; line-height: 1.75; margin-top: 22px; } .safe-note { display: flex; align-items: flex-start; gap: 10px; margin-top: 30px; padding: 13px; color: #9db3c9; border: 1px solid rgba(127,243,199,.16); background: rgba(127,243,199,.04); font: 10px/1.6 var(--mono); } .safe-note svg { flex: 0 0 auto; margin-top: 2px; color: var(--mint); } .safe-note strong { color: var(--mint); font-weight: 500; } .btn-reset { margin-top: 18px; color: #9db3c9; background: transparent; border-color: rgba(151,207,255,.17); padding: 9px 12px; font-size: 10px; }
.scenario-stack { display: flex; flex-direction: column; gap: 10px; } .scenario-card { display: grid; grid-template-columns: 42px 1fr auto; align-items: start; gap: 15px; padding: 17px; border: 1px solid var(--line); background: rgba(10,23,39,.62); transition: border-color .25s ease, background .25s ease, transform .25s ease; } .scenario-card:hover { border-color: rgba(99,230,255,.42); transform: translateX(3px); } .scenario-card.active { background: rgba(20,33,47,.85); } .scenario-card.critical.active { border-color: rgba(255,107,107,.55); } .scenario-card.warning.active { border-color: rgba(245,185,76,.5); } .scenario-icon { display: grid; place-items: center; width: 42px; height: 42px; color: var(--cyan); border: 1px solid rgba(99,230,255,.22); background: rgba(99,230,255,.07); } .scenario-card.warning .scenario-icon { color: var(--amber); border-color: rgba(245,185,76,.24); background: rgba(245,185,76,.06); } .scenario-card.critical .scenario-icon { color: var(--coral); border-color: rgba(255,107,107,.24); background: rgba(255,107,107,.06); } .scenario-title-row { display: flex; align-items: center; gap: 10px; } .scenario-title-row h3 { font-size: 14px; font-weight: 500; } .scenario-title-row span { color: var(--coral); font: 8px var(--mono); letter-spacing: .08em; } .scenario-card.warning .scenario-title-row span { color: var(--amber); } .scenario-content > p { color: #8499ad; font-size: 11px; line-height: 1.55; margin-top: 6px; } .scenario-btn { color: var(--cyan); background: rgba(99,230,255,.06); border-color: rgba(99,230,255,.2); padding: 8px 10px; font-size: 9px; white-space: nowrap; } .scenario-btn:hover { background: rgba(99,230,255,.14); } .play-icon { color: currentColor; font-size: 10px; }
.response-note { margin-top: 13px; padding-top: 12px; border-top: 1px solid rgba(151,207,255,.14); } .response-label { display: inline-flex; align-items: center; gap: 5px; color: var(--mint); font: 9px var(--mono); text-transform: uppercase; letter-spacing: .07em; } .response-note strong { display: block; color: var(--text); font-size: 11px; font-weight: 500; margin-top: 8px; } .response-note p { color: #9bb0c3; font-size: 10px; line-height: 1.6; margin-top: 4px; }

.why-section { border-top: 1px solid rgba(151,207,255,.08); background: rgba(8,17,30,.4); } .why-heading { align-items: center; } .why-heading > p { width: min(470px, 100%); color: var(--muted); font-size: 14px; line-height: 1.75; } .info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; } .info-card { min-height: 235px; padding: 18px; border-top: 1px solid rgba(99,230,255,.36); background: linear-gradient(135deg, rgba(11,28,46,.76), rgba(8,17,29,.56)); } .info-top { display: flex; align-items: center; justify-content: space-between; } .info-number, .paper-kicker { color: #5a7895; font: 10px var(--mono); letter-spacing: .08em; } .info-icon { display: grid; place-items: center; width: 34px; height: 34px; color: var(--cyan); background: rgba(99,230,255,.07); } .info-card h3 { margin-top: 45px; font-size: 16px; font-weight: 500; } .info-card p { margin-top: 10px; color: #849ab0; font-size: 11px; line-height: 1.65; }

.brief-section { border-top: 1px solid rgba(151,207,255,.08); background: linear-gradient(180deg, rgba(15,28,46,.5), rgba(5,9,18,0)); } .brief-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 40px; } .brief-stamp { display: inline-flex; align-items: center; gap: 7px; color: var(--mint); border: 1px solid rgba(127,243,199,.24); padding: 8px 10px; font: 9px var(--mono); text-transform: uppercase; letter-spacing: .06em; } .brief-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 12px; } .brief-main, .presentation-card, .details-card { padding: 24px; } .brief-main h3, .presentation-card h3 { margin-top: 24px; font-size: 23px; letter-spacing: -.04em; } .brief-main > p, .presentation-card > p { color: #8da3b8; font-size: 13px; line-height: 1.75; margin-top: 13px; } .objectives-block { margin-top: 35px; padding-top: 22px; border-top: 1px solid rgba(151,207,255,.12); } .objectives-block ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; } .objectives-block li { display: flex; gap: 9px; color: #b6c8d8; font-size: 11px; line-height: 1.5; } .objectives-block li span { display: grid; place-items: center; flex: 0 0 auto; width: 18px; height: 18px; color: var(--mint); border: 1px solid rgba(127,243,199,.25); }
.presentation-card { position: relative; overflow: hidden; } .demo-orbit { height: 105px; position: relative; margin: 20px -24px 0; overflow: hidden; background: radial-gradient(circle at 30% 70%, rgba(27,98,137,.38), transparent 30%), #07111f; } .demo-orbit::before, .demo-orbit::after { content: ""; position: absolute; border: 1px solid rgba(99,230,255,.3); border-radius: 50%; width: 190px; height: 56px; left: 58px; top: 30px; transform: rotate(-15deg); } .demo-orbit::after { width: 240px; height: 80px; left: 27px; top: 18px; border-color: rgba(127,243,199,.16); transform: rotate(34deg); } .demo-earth { position: absolute; left: 46px; bottom: -55px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #1e9cc1, #071b32 64%, #020611); box-shadow: 0 0 30px rgba(48,178,226,.24); } .demo-satellite { position: absolute; right: 48px; top: 23px; display: grid; place-items: center; width: 34px; height: 27px; color: var(--cyan); border: 1px solid var(--cyan); background: #081829; transform: rotate(-18deg); } .demo-satellite::before, .demo-satellite::after { content: ""; position: absolute; top: 5px; width: 25px; height: 15px; border: 1px solid rgba(99,230,255,.7); background: #0b2846; } .demo-satellite::before { right: 29px; } .demo-satellite::after { left: 29px; } .presentation-card .btn { margin-top: 22px; }
.details-card { display: flex; flex-direction: column; } .detail-row { display: flex; flex-direction: column; gap: 5px; padding: 16px 0; border-bottom: 1px solid rgba(151,207,255,.1); } .detail-row span { color: #66809a; font: 9px var(--mono); text-transform: uppercase; letter-spacing: .06em; } .detail-row strong { color: #d4e5f3; font-size: 12px; font-weight: 500; } .edit-note { display: flex; gap: 8px; align-items: flex-start; margin-top: auto; padding-top: 20px; color: #718aa1; font: 9px/1.6 var(--mono); } .edit-note svg { flex: 0 0 auto; color: var(--cyan); margin-top: 1px; } .edit-note code { color: var(--cyan); }
.disclaimer-section { padding: 0 0 76px; } .disclaimer { display: flex; align-items: center; gap: 18px; padding: 20px 22px; border: 1px solid rgba(245,185,76,.27); background: rgba(245,185,76,.055); } .disclaimer-icon { display: grid; place-items: center; width: 37px; height: 37px; flex: 0 0 auto; color: var(--amber); border: 1px solid rgba(245,185,76,.35); } .disclaimer h3 { color: var(--amber); font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; } .disclaimer p { margin-top: 5px; color: #b5bdc2; font-size: 11px; line-height: 1.55; } .disclaimer-code { margin-inline-start: auto; color: #866f45; font: 9px var(--mono); white-space: nowrap; }
.site-footer { border-top: 1px solid rgba(151,207,255,.1); padding: 24px 0; background: #040810; } .footer-inner { display: flex; align-items: center; gap: 22px; } .footer-inner > span { color: #647b93; font: 9px var(--mono); } .back-top { display: inline-flex; align-items: center; gap: 6px; margin-inline-start: auto; font-family: var(--mono); font-size: 9px; }

@keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } } @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } } @keyframes orbit-spin { from { transform: rotate(-28deg) rotate(0deg); } to { transform: rotate(-28deg) rotate(360deg); } } @keyframes earth-scan { 0% { transform: rotate(0deg) scale(.9); opacity: .2; } 50% { opacity: .8; } 100% { transform: rotate(360deg) scale(1.2); opacity: .1; } } @keyframes float-sat { 0%,100% { translate: 0 0; } 50% { translate: -8px 8px; } } @keyframes signal-ring { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } } @keyframes scan { 0%,100% { translate: 0 -60px; opacity: 0; } 40%,60% { opacity: .42; } 50% { translate: 0 60px; } } @keyframes scroll-wheel { 0% { opacity: 0; translate: 0 -2px; } 30% { opacity: 1; } 100% { opacity: 0; translate: 0 6px; } }

@media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; } .orbital-stage { width: min(100%, 540px); justify-self: center; margin-top: -30px; } .hero-copy { max-width: 650px; } .metric-grid { grid-template-columns: repeat(2, 1fr); } .simulator-grid { gap: 48px; } .brief-grid { grid-template-columns: 1fr 1fr; } .brief-main { grid-row: span 2; } .info-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px) { .container { width: min(100% - 32px, 560px); } .section-pad { padding: 86px 0; } .header-inner { height: 68px; } .main-nav { display: none; position: absolute; top: 67px; left: 16px; right: 16px; flex-direction: column; align-items: stretch; gap: 0; padding: 8px 15px; border: 1px solid var(--line); background: rgba(7,17,31,.96); box-shadow: 0 18px 35px rgba(0,0,0,.3); } .main-nav.open { display: flex; } .main-nav button { padding: 13px 2px; text-align: start; border-bottom: 1px solid rgba(151,207,255,.08); } .main-nav button:last-child { border-bottom: 0; } .menu-toggle { display: grid; place-items: center; } .language-toggle { padding: 7px 9px; } .hero-section { min-height: auto; padding-top: 132px; } .hero-grid { display: flex; flex-direction: column; align-items: stretch; gap: 0; } h1 { font-size: clamp(48px, 16vw, 75px); } .hero-body { font-size: 14px; } .hero-cta-row { align-items: stretch; flex-direction: column; width: 100%; } .hero-cta-row .btn { width: 100%; } .hero-trust-row { gap: 10px; } .orbital-stage { margin-top: 10px; width: 100%; } .hero-bottom-line { flex-wrap: wrap; gap: 13px; font-size: 8px; } .scroll-hint { display: none; } .section-heading-row, .why-heading, .brief-header { align-items: flex-start; flex-direction: column; } .sync-readout { margin-top: -22px; } .metric-grid, .info-grid { grid-template-columns: 1fr 1fr; } .metric-card { min-height: 146px; padding: 14px; } .metric-detail { align-items: flex-start; flex-direction: column; gap: 4px; } .dashboard-layout, .simulator-grid, .brief-grid { grid-template-columns: 1fr; } .brief-main { grid-row: auto; } .simulator-copy { max-width: none; } .scenario-card { grid-template-columns: 36px 1fr; } .scenario-icon { width: 36px; height: 36px; } .scenario-btn { grid-column: 2; justify-self: start; } .activity-row { grid-template-columns: 24px 1fr; padding: 10px 0; } .activity-row time { grid-column: 2; margin-top: -5px; } .chart-footer { flex-wrap: wrap; gap: 12px; } .disclaimer { align-items: flex-start; } .disclaimer-code { display: none; } .footer-inner { flex-wrap: wrap; gap: 14px; } .footer-inner > span { width: 100%; order: 3; } }
@media (max-width: 420px) { .metric-grid { grid-template-columns: 1fr; } .metric-card { min-height: 130px; } .info-grid { grid-template-columns: 1fr; } .info-card { min-height: 190px; } .info-card h3 { margin-top: 28px; } .chart-legend { display: none; } .earth { width: 48%; } .satellite { right: 3%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .001ms !important; } }

/* Satellite Cybersecurity Map */
.orbital-map-panel { margin-top: 12px; padding: 20px; overflow: hidden; }
.map-panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.map-panel-header h3 { margin-top: 7px; color: var(--text); font-size: 20px; letter-spacing: -.04em; font-weight: 500; }
.map-panel-header p { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.map-header-tools { display: flex; flex-direction: column; align-items: end; gap: 12px; }
.map-live { display: inline-flex; align-items: center; gap: 7px; color: var(--mint); font: 9px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.map-live > span { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 9px var(--mint); animation: pulse 2s infinite; }
.map-zoom { display: flex; gap: 5px; }
.map-zoom button { display: grid; place-items: center; width: 28px; height: 28px; color: #a7c0d5; background: rgba(99,230,255,.05); border: 1px solid rgba(151,207,255,.2); }
.map-zoom button:hover { color: var(--cyan); border-color: var(--cyan); background: rgba(99,230,255,.12); }
.map-stage { position: relative; min-height: 400px; margin-top: 18px; overflow: hidden; border: 1px solid rgba(99,230,255,.13); background: #050c17; cursor: grab; touch-action: none; }
.map-stage:active { cursor: grabbing; }
.map-stage svg { display: block; width: 100%; height: auto; min-height: 400px; }
.map-orbits ellipse { fill: none; stroke: rgba(99,230,255,.25); stroke-width: 1.2; stroke-dasharray: 5 8; }
.map-earth-scan { transform-origin: 500px 260px; animation: map-earth-spin 18s linear infinite; }
.map-link { fill: none; vector-effect: non-scaling-stroke; animation: map-link-flow 2.3s linear infinite; }
.map-link.active { animation-duration: .8s; filter: drop-shadow(0 0 5px currentColor); }
.map-node { cursor: pointer; outline: none; }
.map-node circle { transition: r .2s ease, stroke-width .2s ease; }
.map-node:hover circle:nth-child(2), .map-node:focus circle:nth-child(2) { stroke-width: 3.5; }
.map-node .node-pulse { fill: none; stroke-width: 1; opacity: .4; animation: map-node-pulse 2.4s ease-out infinite; }
.map-node.secure { color: var(--cyan); } .map-node.review { color: var(--amber); } .map-node.threat { color: var(--coral); }
.map-labels text { font: 9px var(--mono); letter-spacing: .08em; pointer-events: none; }
.map-threat-callout rect { fill: rgba(73,22,29,.88); stroke: var(--coral); stroke-width: 1; filter: drop-shadow(0 0 7px rgba(255,107,107,.25)); }
.map-threat-callout svg { color: var(--coral); }
.map-threat-callout text:first-of-type { fill: #ffc4c4; font: 600 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.map-threat-callout text:last-of-type { fill: #f39494; font: 8px var(--mono); }
.map-alert-pattern .map-threat-callout rect { fill: rgba(62,45,17,.9); stroke: var(--amber); }
.map-alert-pattern .map-threat-callout svg { color: var(--amber); }
.map-alert-pattern .map-threat-callout text:first-of-type { fill: #ffe0a4; }
.map-alert-pattern .map-threat-callout text:last-of-type { fill: #e9b85d; }
.map-pan-hint { position: absolute; left: 14px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; color: #7890a7; background: rgba(4,10,18,.72); border: 1px solid rgba(151,207,255,.13); font: 9px var(--mono); pointer-events: none; }
.map-detail-card { position: absolute; top: 14px; right: 14px; width: min(280px, calc(100% - 28px)); padding: 15px; border: 1px solid rgba(99,230,255,.28); background: rgba(6,16,28,.94); box-shadow: 0 14px 35px rgba(0,0,0,.35); backdrop-filter: blur(12px); }
.map-detail-top { display: flex; align-items: center; justify-content: space-between; }
.map-detail-top button { border: 0; background: none; color: #7690a6; font-size: 22px; line-height: 1; }
.map-detail-top button:hover { color: var(--text); }
.map-detail-icon { display: grid; place-items: center; width: 34px; height: 34px; color: var(--cyan); border: 1px solid currentColor; background: rgba(99,230,255,.08); }
.map-detail-icon.review { color: var(--amber); } .map-detail-icon.threat { color: var(--coral); }
.map-detail-type { display: block; margin-top: 13px; color: #65819b; font: 8px var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.map-detail-card h4 { margin-top: 5px; color: var(--text); font-size: 17px; font-weight: 500; letter-spacing: -.03em; }
.map-detail-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; color: var(--mint); font: 9px var(--mono); text-transform: uppercase; }
.map-detail-status.review { color: var(--amber); } .map-detail-status.threat { color: var(--coral); } .map-detail-status > span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 7px currentColor; }
.map-detail-row { display: grid; grid-template-columns: 15px 1fr; gap: 5px 7px; margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(151,207,255,.1); color: var(--cyan); }
.map-detail-row span { color: #66819a; font: 8px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.map-detail-row strong { grid-column: 2; color: #cfdfeb; font: 10px/1.45 var(--mono); font-weight: 400; }
.map-detail-footer { display: flex; align-items: center; gap: 6px; margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(127,243,199,.15); color: var(--mint); font: 8px var(--mono); text-transform: uppercase; }
.map-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; padding-top: 14px; }
.map-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; color: #7890a8; font: 9px var(--mono); }
.map-legend > span { display: inline-flex; align-items: center; gap: 5px; }
.legend-title { color: #c8d9e7; text-transform: uppercase; letter-spacing: .07em; }
.map-legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.map-legend-dot.safe { background: var(--cyan); box-shadow: 0 0 7px var(--cyan); } .map-legend-dot.review { background: var(--amber); box-shadow: 0 0 7px var(--amber); } .map-legend-dot.threat { background: var(--coral); box-shadow: 0 0 7px var(--coral); }
.map-data-note { display: inline-flex; align-items: center; gap: 5px; color: var(--mint); font: 9px var(--mono); }
@keyframes map-link-flow { to { stroke-dashoffset: -34; } } @keyframes map-node-pulse { 0% { r: 13px; opacity: .6; } 100% { r: 28px; opacity: 0; } } @keyframes map-earth-spin { to { transform: rotate(360deg); } }
@media (max-width: 700px) { .orbital-map-panel { padding: 14px; } .map-panel-header { flex-direction: column; } .map-header-tools { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; } .map-stage, .map-stage svg { min-height: 300px; } .map-detail-card { top: 10px; right: 10px; } .map-pan-hint { font-size: 8px; max-width: calc(100% - 20px); } .map-footer { align-items: flex-start; flex-direction: column; } }
</style>

Eyebrow:"SAFE SCENARIO LAB",simulatorTitle:"Test the response layer",simulatorBody:"Trigger a synthetic event to see how SpaceShield classifies, contains, and explains the signal. Nothing leaves this browser.",run:"Run scenario",reset:"Reset simulation",response:"SPACE SHIELD RESPONSE",detected:"Scenario detected",contained:"Contained in simulation",scenarioCommand:"Unauthorized command attempt",scenarioCommandDesc:"A command signature appears outside the expected ground-station window.",scenarioPattern:"Suspicious communication pattern",scenarioPatternDesc:"Packet timing and volume drift from the synthetic mission baseline.",scenarioLogin:"Unknown ground-station login",scenarioLoginDesc:"A login attempt arrives from an unregistered synthetic station ID.",commandResponse:"Command rejected, session isolated, and the event added to the audit trail.",patternResponse:"Pattern flagged for analyst review; synthetic traffic is rate-limited while context is gathered.",loginResponse:"Access denied, token revoked, and the synthetic station is placed in observation mode.",why:"Why space cybersecurity matters",whyBody:"Satellites support communication, navigation, climate observation, and emergency response. Protecting the command-and-control layer is part of protecting the services people depend on below.",problem:"The problem",problemBody:"Space systems are remote, complex, and increasingly connected. A small anomaly can be difficult to contextualize when operators have limited visibility across the full signal path.",solution:"The proposed solution",solutionBody:"SpaceShield presents an explainable monitoring layer that combines synthetic telemetry, event classification, and response guidance in one learning environment.",method:"Methodology",methodBody:"Model the signal \u2192 inject safe synthetic scenarios \u2192 classify the event \u2192 show the response \u2192 record the learning outcome.",impact:"Expected impact",impactBody:"Help students and evaluators understand how
